name: MeeABridge
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
packages:
  MeeABridgeCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: org.example.MeeABridge
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  MeeABridge:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: $(MEEA_TEAM_ID)
          CODE_SIGN_IDENTITY: $(MEEA_SIGNING_IDENTITY)
          PROVISIONING_PROFILE_SPECIFIER: $(MEEA_PROFILE_UUID)
          OTHER_CODE_SIGN_FLAGS: '--keychain "$(MEEA_KEYCHAIN_PATH)"'
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGNING_REQUIRED: YES
    dependencies:
      - package: MeeABridgeCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: MeeA Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSHealthShareUsageDescription: MeeA Bridge reads your daily steps so you can preview and manually send them to your own MeeA server.
        NSHealthUpdateUsageDescription: MeeA Bridge does not write or change your Health data. It only reads daily steps for your preview and manual sync.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Generated/MeeABridge.entitlements
      properties:
        com.apple.developer.healthkit: true
schemes:
  MeeABridge:
    build:
      targets:
        MeeABridge: all
