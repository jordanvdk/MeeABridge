name: Unsigned iOS candidate
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: unsigned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Show build tools
        run: |
          xcodebuild -version
          swift --version
      - name: Test core contract
        run: swift test
      - name: Verify distribution helper
        run: python3 -m unittest discover -s scripts/tests
      - name: Generate app icon
        run: swift scripts/GenerateAppIcon.swift
      - name: Generate Xcode project
        run: bash scripts/install-xcodegen.sh
      - name: Build unsigned simulator app
        run: >-
          xcodebuild -project MeeABridge.xcodeproj -scheme MeeABridge
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: ditto -c -k --keepParent DerivedData/Build/Products/Debug-iphonesimulator/MeeABridge.app MeeABridge-unsigned-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MeeABridge-unsigned-simulator-not-for-iPhone
          path: MeeABridge-unsigned-simulator.zip
          retention-days: 3
          if-no-files-found: error
